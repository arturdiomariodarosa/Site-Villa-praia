<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Prévia reservada</title><style>html,body{margin:0;height:100%;background:#f8f6f0;color:#123e46;font:16px system-ui}main{padding:32px;max-width:420px;margin:auto}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}p{line-height:1.5}</style><main><h1>Prévia reservada</h1><p id="status">Abra o link completo de avaliação recebido do proprietário.</p></main><script>
(async()=>{const status=document.getElementById('status');const raw=location.hash.slice(1);if(!/^[A-Za-z0-9_-]{43}$/.test(raw))return;try{status.textContent='Carregando a prévia...';const key=Uint8Array.from(atob(raw.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));const enc=new Uint8Array(23786261);for(let start=0;start<32;start+=6){const parts=await Promise.all(Array.from({length:Math.min(6,32-start)},(_,j)=>start+j).map(async i=>{const res=await fetch('assets/villa-'+String(i).padStart(2,'0')+'.bin');if(!res.ok)throw Error('download');const bytes=new Uint8Array(await res.arrayBuffer());if(bytes.length!==Math.min(750000,enc.length-i*750000))throw Error('size');return [i,bytes]}));for(const [i,bytes] of parts)enc.set(bytes,i*750000);status.textContent='Carregando a prévia... '+Math.round(Math.min(32,start+6)/32*100)+'%';}const k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['decrypt']);const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:enc.slice(0,12)},k,enc.slice(12));const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).blob();const frame=document.createElement('iframe');frame.title='Villa Itapirubá';frame.referrerPolicy='no-referrer';frame.allow='autoplay; fullscreen';frame.src=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));document.body.append(frame);}catch(e){status.textContent='Não foi possível abrir. Confira se o link está completo e utilize um navegador atualizado.'}})();</script></html>
